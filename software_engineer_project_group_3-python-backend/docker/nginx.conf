# [API] Cấu hình nginx cho container web:
#   - phục vụ giao diện (HTML/CSS/JS/ảnh) như trước
#   - chuyển tiếp mọi đường dẫn /api/ sang server Python (service "backend" trong docker-compose.yml)
# Nhờ vậy trình duyệt chỉ nói chuyện với 1 địa chỉ (http://localhost:8080) → không bị lỗi CORS.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
