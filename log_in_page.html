
<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">

  <!-- Thiết lập giao diện responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Đăng nhập / Đăng ký</title>

  <!-- CSS chính -->
  <link rel="stylesheet" href="log_in_page.css">
</head>

<body>

  <!-- Khung đăng nhập / đăng ký -->
  <main class="card">

    <!-- Radio điều khiển tab bằng CSS -->
    <input type="radio" name="tab" id="tab-login" checked>
    <input type="radio" name="tab" id="tab-signup">

    <!-- Tab đăng nhập / đăng ký -->
    <div class="tabs">
      <label for="tab-login">
        Đăng nhập
      </label>

      <label for="tab-signup">
        chưa có tài khoản?
      </label>

      <!-- Nền tab đang chọn -->
      <span class="indicator"></span>
    </div>

    <!-- Form đăng nhập -->
    <form class="form form-login" action="#" method="post">

      <h1>Chào mừng trở lại</h1>

      <p class="subtitle">
        Đăng nhập để tiếp tục
      </p>

      <!-- Tên đăng nhập -->
      <div class="field">
        <label for="login-user">
          Tên đăng nhập
        </label>

        <input type="text" id="login-user" name="username"
          placeholder="Nhập tên đăng nhập" required
          autocomplete="username">
      </div>

      <!-- Mật khẩu -->
      <div class="field">
        <label for="login-pass">
          Mật khẩu
        </label>

        <input type="password" id="login-pass" name="password"
          placeholder="Nhập mật khẩu" required
          autocomplete="current-password">
      </div>

      <!-- Quên mật khẩu -->
      <a href="#" class="forgot">
        Quên mật khẩu?
      </a>

      <!-- Nút đăng nhập -->
      <button type="submit" class="btn-primary">
        Đăng nhập
      </button>

      <!-- Phân cách đăng nhập mạng xã hội -->
      <div class="divider">
        <span>hoặc tiếp tục với</span>
      </div>

      <!-- Đăng nhập mạng xã hội -->
      <div class="social">
        <button type="button" class="btn-social">
          <span class="social-icon">G</span>
          Google
        </button>

        <button type="button" class="btn-social">
          <span class="social-icon">f</span>
          Facebook
        </button>
      </div>

    </form>

    <!-- Form đăng ký -->
    <form class="form form-signup" action="#" method="post">

      <h1>Tạo tài khoản</h1>

      <p class="subtitle">
        Chỉ mất vài giây để bắt đầu
      </p>

      <!-- Tên đăng nhập -->
      <div class="field">
        <label for="signup-user">
          Tên đăng nhập
        </label>

        <input type="text" id="signup-user" name="username"
          placeholder="Chọn tên đăng nhập" required
          autocomplete="username">
      </div>

      <!-- Mật khẩu -->
      <div class="field">
        <label for="signup-pass">
          Mật khẩu
        </label>

        <input type="password" id="signup-pass" name="password"
          placeholder="Tạo mật khẩu" required minlength="6"
          autocomplete="new-password">
      </div>

      <!-- Xác nhận mật khẩu -->
      <div class="field">
        <label for="signup-confirm">
          Nhập lại mật khẩu
        </label>

        <input type="password" id="signup-confirm" name="confirm"
          placeholder="Nhập lại mật khẩu" required minlength="6"
          autocomplete="new-password">
      </div>

      <!-- Nút đăng ký -->
      <button type="submit" class="btn-primary">
        chưa có tài khoản?
      </button>

      <!-- Phân cách đăng ký mạng xã hội -->
      <div class="divider">
        <span>hoặc đăng ký với</span>
      </div>

      <!-- Đăng ký mạng xã hội -->
      <div class="social">
        <button type="button" class="btn-social">
          <span class="social-icon">G</span>
          Google
        </button>

        <button type="button" class="btn-social">
          <span class="social-icon">f</span>
          Facebook
        </button>
      </div>

    </form>

  </main>

  <!-- Thông báo -->
  <div id="toast" class="toast" role="status"
    aria-live="polite"></div>

  <!-- JavaScript chính -->
  <script src="log_in_page.js"></script>
</body>

</html>
