<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập / Đăng ký</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card">
    <!-- Radio điều khiển chuyển tab (không cần JavaScript) -->
    <input type="radio" name="tab" id="tab-login" checked>
    <input type="radio" name="tab" id="tab-signup">

    <div class="tabs">
      <label for="tab-login">Đăng nhập</label>
      <label for="tab-signup">Đăng ký</label>
      <span class="indicator"></span>
    </div>

    <!-- ĐĂNG NHẬP -->
    <form class="form form-login" action="#" method="post">
      <h1>Chào mừng trở lại</h1>
      <p class="subtitle">Đăng nhập để tiếp tục</p>

      <div class="field">
        <label for="login-user">Tên đăng nhập</label>
        <input type="text" id="login-user" name="username" placeholder="Nhập tên đăng nhập" required autocomplete="username">
      </div>

      <div class="field">
        <label for="login-pass">Mật khẩu</label>
        <input type="password" id="login-pass" name="password" placeholder="Nhập mật khẩu" required autocomplete="current-password">
      </div>

      <a href="#" class="forgot">Quên mật khẩu?</a>

      <button type="submit" class="btn-primary">Đăng nhập</button>

      <div class="divider"><span>hoặc tiếp tục với</span></div>

      <div class="social">
        <button type="button" class="btn-social">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="#4285F4" d="M23.5 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.45a5.52 5.52 0 0 1-2.39 3.62v3h3.87c2.27-2.09 3.57-5.17 3.57-8.81z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.94-2.91l-3.87-3c-1.07.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.27v3.1A12 12 0 0 0 12 24z"/>
            <path fill="#FBBC05" d="M5.27 14.28A7.2 7.2 0 0 1 4.9 12c0-.79.14-1.56.37-2.28v-3.1H1.27A12 12 0 0 0 0 12c0 1.94.46 3.77 1.27 5.38l4-3.1z"/>
            <path fill="#EA4335" d="M12 4.77c1.76 0 3.34.61 4.59 1.8l3.43-3.43C17.95 1.19 15.24 0 12 0A12 12 0 0 0 1.27 6.62l4 3.1C6.22 6.88 8.87 4.77 12 4.77z"/>
          </svg>
          Google
        </button>
        <button type="button" class="btn-social">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="#1877F2" d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.69.24 2.69.24v2.97h-1.52c-1.49 0-1.96.93-1.96 1.88v2.26h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z"/>
          </svg>
          Facebook
        </button>
      </div>
    </form>

    <!-- ĐĂNG KÝ -->
    <form class="form form-signup" action="#" method="post">
      <h1>Tạo tài khoản</h1>
      <p class="subtitle">Chỉ mất vài giây để bắt đầu</p>

      <div class="field">
        <label for="signup-user">Tên đăng nhập</label>
        <input type="text" id="signup-user" name="username" placeholder="Chọn tên đăng nhập" required autocomplete="username">
      </div>

      <div class="field">
        <label for="signup-pass">Mật khẩu</label>
        <input type="password" id="signup-pass" name="password" placeholder="Tạo mật khẩu" required minlength="6" autocomplete="new-password">
      </div>

      <div class="field">
        <label for="signup-confirm">Nhập lại mật khẩu</label>
        <input type="password" id="signup-confirm" name="confirm" placeholder="Nhập lại mật khẩu" required minlength="6" autocomplete="new-password">
      </div>

      <button type="submit" class="btn-primary">Đăng ký</button>

      <div class="divider"><span>hoặc đăng ký với</span></div>

      <div class="social">
        <button type="button" class="btn-social">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="#4285F4" d="M23.5 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.45a5.52 5.52 0 0 1-2.39 3.62v3h3.87c2.27-2.09 3.57-5.17 3.57-8.81z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.94-2.91l-3.87-3c-1.07.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.27v3.1A12 12 0 0 0 12 24z"/>
            <path fill="#FBBC05" d="M5.27 14.28A7.2 7.2 0 0 1 4.9 12c0-.79.14-1.56.37-2.28v-3.1H1.27A12 12 0 0 0 0 12c0 1.94.46 3.77 1.27 5.38l4-3.1z"/>
            <path fill="#EA4335" d="M12 4.77c1.76 0 3.34.61 4.59 1.8l3.43-3.43C17.95 1.19 15.24 0 12 0A12 12 0 0 0 1.27 6.62l4 3.1C6.22 6.88 8.87 4.77 12 4.77z"/>
          </svg>
          Google
        </button>
        <button type="button" class="btn-social">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="#1877F2" d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.69.24 2.69.24v2.97h-1.52c-1.49 0-1.96.93-1.96 1.88v2.26h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z"/>
          </svg>
          Facebook
        </button>
      </div>
    </form>
  </main>

</body>
</html>
