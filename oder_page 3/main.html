<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>-----------------</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo"></span><strong>------------</strong></div>
    <nav id="nav">
      <button class="nav-btn" data-view="order">Order Online</button>
      <button class="nav-btn" data-view="cart">Cart <span class="badge" id="cartBadge">0</span></button>
      <button class="nav-btn" data-view="checkout">Checkout</button>
      <button class="nav-btn" data-view="dashboard">Customer Dashboard</button>
    </nav>
    <!-- Hiện khi đã chọn vai trò: tên người dùng + nút Đổi vai trò / Đăng xuất -->
    <div class="userbox"><span id="userLabel"></span><button class="nav-btn" id="exitBtn">Thoát</button></div>
  </header>
  <main id="app" class="container"></main>
  <div id="modalRoot"></div>
  <div id="toast" class="toast"></div>
  
  <!-- Scripts separated for modularity (OOP style) -->
  <script src="Helpers.js"></script>
  <script src="Models.js"></script>
  <script src="Data.js"></script>      <!-- dữ liệu mẫu: thực đơn -->
  <script src="Users.js"></script>     <!-- dữ liệu mẫu: tài khoản Staff/Admin -->
  <script src="Orders.js"></script>    <!-- dữ liệu mẫu: vài đơn hàng để demo -->
  <script src="Payment.js"></script> 
  <script src="Storage.js"></script>   <!-- lớp DB/Store: đọc/ghi localStorage (phải nằm sau các file dữ liệu mẫu) -->
  <script src="Modals.js"></script>
  <script src="Views.js"></script>
  <script src="StaffViews.js"></script> <!-- Welcome, Staff Dashboard, Admin Dashboard (phải nằm sau Views.js) -->
  <script src="App.js"></script>
</body>
</html>
